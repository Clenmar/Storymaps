<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Colors!</title>
<script type="importmap">
{ "imports": { "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/+esm" } }
</script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:'Fredoka One','Comic Sans MS',cursive; touch-action:none; }
  #game { width:100vw; height:100vh; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:space-between;
          background:linear-gradient(160deg,#2b2456,#0f2247); transition:background .4s; }
  #prompt { margin-top:5vh; font-size:clamp(1.6rem,7vw,3.2rem); color:#fff; text-shadow:0 4px 14px rgba(0,0,0,.4); text-align:center; padding:0 16px; min-height:1.6em; }
  #choices { flex:1; display:flex; align-items:center; justify-content:center; gap:clamp(14px,4vw,44px); flex-wrap:wrap; padding:16px; width:100%; }
  .blob { width:clamp(110px,30vw,220px); aspect-ratio:1; border-radius:50%; cursor:pointer; box-shadow:0 16px 40px rgba(0,0,0,.35), inset 0 -14px 24px rgba(0,0,0,.2), inset 0 14px 24px rgba(255,255,255,.35);
          transition:transform .12s cubic-bezier(.34,1.56,.64,1); }
  .blob:active { transform:scale(.93); }
  .blob.win { animation:win .6s cubic-bezier(.34,1.56,.64,1); }
  .blob.wiggle { animation:wiggle .4s; }
  @keyframes win { 0%{transform:scale(1)} 40%{transform:scale(1.22)} 100%{transform:scale(1)} }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .btn { position:absolute; z-index:100; background:rgba(255,255,255,.22); border:2px solid rgba(255,255,255,.4); color:#fff;
         border-radius:50px; padding:8px 16px; font-family:inherit; font-size:1rem; cursor:pointer; backdrop-filter:blur(6px); text-decoration:none; }
  #fs-btn{bottom:20px;right:20px} #sound-btn{top:16px;right:16px;padding:8px 12px;font-size:1.4rem} #back-btn{top:16px;left:16px}
  .confetti { position:absolute; font-size:2.2rem; pointer-events:none; z-index:60; animation:fall 1.2s ease-out forwards; }
  @keyframes fall { 0%{opacity:1;transform:translateY(0) rotate(0)} 100%{opacity:0;transform:translateY(60vh) rotate(300deg)} }
</style>
</head>
<body>
<div id="game">
  <a id="back-btn" class="btn" href="../index.html">←</a>
  <div id="sound-btn" class="btn" onclick="toggleSound()">🔊</div>
  <div id="voice-btn" class="btn" onclick="BabyVoice.openPicker()" style="bottom:20px;left:50%;transform:translateX(-50%);padding:7px 14px;font-size:.9rem">🗣️ Voice</div>
  <div id="prompt">Tap to start! 👆</div>
  <div id="choices"></div>
  <button id="fs-btn" class="btn" onclick="goFullscreen()">⛶ Full Screen</button>
</div>
<script src="voice.js"></script>
<script>
var COLORS = [
  {name:"red",    bg:"#ff4757"},{name:"orange",bg:"#ff9f2e"},{name:"yellow",bg:"#ffd93a"},
  {name:"green",  bg:"#3ddc84"},{name:"blue",  bg:"#3aa0ff"},{name:"purple",bg:"#a86bff"},
  {name:"pink",   bg:"#ff6fc7"},{name:"brown", bg:"#b5793a"},{name:"white", bg:"#f4f4f8"}
];
var soundOn=true, target=null, started=false, actx=null;
function ctx(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function chime(){ if(!soundOn) return; try{ var c=ctx(); [523,659,784,1047].forEach(function(f,i){ var o=c.createOscillator(),g=c.createGain(); o.connect(g); g.connect(c.destination);
  o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,c.currentTime+i*.09); g.gain.exponentialRampToValueAtTime(.3,c.currentTime+i*.09+.02);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+i*.09+.35); o.start(c.currentTime+i*.09); o.stop(c.currentTime+i*.09+.4); }); }catch(e){} }
function boing(){ if(!soundOn) return; try{ var c=ctx(),o=c.createOscillator(),g=c.createGain(); o.connect(g); g.connect(c.destination);
  o.type='sine'; o.frequency.setValueAtTime(300,c.currentTime); o.frequency.exponentialRampToValueAtTime(160,c.currentTime+.25);
  g.gain.setValueAtTime(.3,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.3); o.start(); o.stop(c.currentTime+.3);}catch(e){} }
function say(t,cb){ if(!soundOn){ if(cb)setTimeout(cb,500); return; } BabyVoice.say(t,cb); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function round(){
  var choices = shuffle(COLORS).slice(0,3);
  target = choices[Math.floor(Math.random()*choices.length)];
  var box=document.getElementById('choices'); box.innerHTML='';
  shuffle(choices).forEach(function(col){
    var b=document.createElement('div'); b.className='blob'; b.style.background=col.bg;
    b.addEventListener('click', function(){ pick(col, b); });
    box.appendChild(b);
  });
  document.getElementById('prompt').innerHTML = "Tap the <b style='color:"+target.bg+"'>"+target.name+"</b> one! 🎨";
  setTimeout(function(){ say("Tap the " + target.name + " one"); }, 250);
}
function pick(col, node){
  if(col.name===target.name){
    node.classList.add('win'); chime(); confetti();
    document.getElementById('prompt').innerHTML = "Yes! <b style='color:"+target.bg+"'>"+target.name+"</b>! 🎉";
    say("Yes! " + target.name + "!", function(){ round(); });
    setTimeout(round, 2500);
  } else {
    node.classList.add('wiggle'); boing(); setTimeout(function(){ node.classList.remove('wiggle'); }, 400);
    say("Try again. Tap the " + target.name + " one.");
  }
}
function confetti(){ var g=document.getElementById('game'), ce="🎉🎈⭐🌟✨🌈".split('');
  for(var i=0;i<16;i++){ var el=document.createElement('div'); el.className='confetti'; el.textContent=ce[Math.floor(Math.random()*ce.length)];
    el.style.left=(Math.random()*100)+'vw'; el.style.top='-8vh'; el.style.animationDelay=(Math.random()*.3)+'s'; g.appendChild(el);
    el.addEventListener('animationend', function(){ this.remove(); }); } }
function toggleSound(){ soundOn=!soundOn; document.getElementById('sound-btn').textContent=soundOn?'🔊':'🔇'; if(!soundOn){try{speechSynthesis.cancel();}catch(e){}} }
function goFullscreen(){ var el=document.documentElement,r=el.requestFullscreen||el.webkitRequestFullscreen; if(r)r.call(el);
  setTimeout(function(){ var b=document.getElementById('fs-btn'); b.style.opacity='0'; b.style.pointerEvents='none'; },1000); }
document.addEventListener('fullscreenchange', function(){ if(!document.fullscreenElement){ var b=document.getElementById('fs-btn'); b.style.opacity='1'; b.style.pointerEvents='auto'; } });
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){ e.preventDefault(); }, { passive:false });
document.getElementById('game').addEventListener('click', function(){
  if(started) return; started=true; try{ctx().resume();}catch(e){}
  round();
});
</script>
</body>
</html>
