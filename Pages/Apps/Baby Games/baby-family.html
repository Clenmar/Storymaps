<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Where's Mommy?</title>
<script type="importmap">
{ "imports": { "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/+esm" } }
</script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:'Fredoka One','Comic Sans MS',cursive; touch-action:none; }
  #game { width:100vw; height:100vh; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:space-between;
          background:radial-gradient(ellipse at 30% 20%,#ffd45e 0%,transparent 55%),radial-gradient(ellipse at 80% 80%,#ff8fc7 0%,transparent 55%),linear-gradient(160deg,#7c5cff,#37c7ff); }
  #prompt { margin-top:6vh; font-size:clamp(1.8rem,7vw,3.4rem); color:#fff; text-shadow:0 4px 14px rgba(0,0,0,.35); text-align:center; padding:0 16px; min-height:3.2rem; }
  #prompt small { display:block; font-size:.5em; opacity:.85; margin-top:6px; }
  #choices { flex:1; display:flex; align-items:center; justify-content:center; gap:clamp(14px,4vw,40px); flex-wrap:wrap; padding:16px; width:100%; }
  .card { width:clamp(120px,34vw,240px); aspect-ratio:1; border-radius:32px; background:rgba(255,255,255,.92);
          display:flex; align-items:center; justify-content:center; flex-direction:column; box-shadow:0 16px 40px rgba(0,0,0,.25);
          cursor:pointer; transition:transform .12s cubic-bezier(.34,1.56,.64,1); }
  .card:active { transform:scale(.94); }
  .card .face { font-size:clamp(4rem,15vw,8rem); line-height:1; width:74%; aspect-ratio:1; border-radius:50%;
                overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.18); background:#F1ECFF; }
  .card .who  { font-size:clamp(1rem,4vw,1.6rem); color:#5a3fb0; margin-top:6px; }
  #photo-btn { position:absolute; z-index:99; top:calc(env(safe-area-inset-top,0px) + 58px); left:12px;
    background:rgba(255,255,255,.9); color:#5a3fb0; border:0; border-radius:999px; padding:9px 14px;
    font-family:inherit; font-size:.85rem; font-weight:700; box-shadow:0 4px 14px rgba(60,40,110,.2); cursor:pointer; }
  #photo-sheet { position:fixed; inset:0; z-index:99998; background:rgba(30,20,60,.62); display:none;
    align-items:flex-end; justify-content:center; padding:0 12px 12px; }
  #photo-sheet.on { display:flex; }
  #photo-sheet .inner { background:#fff; width:100%; max-width:420px; border-radius:22px; padding:18px;
    max-height:86vh; overflow:auto; font-family:system-ui,-apple-system,sans-serif; }
  #photo-sheet h3 { font-family:inherit; color:#3a1d6e; font-size:1.15rem; margin-bottom:4px; }
  #photo-sheet p { color:#777; font-size:.82rem; font-weight:600; margin-bottom:12px; line-height:1.45; }
  #photo-sheet .prow { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid #f0ecfa; }
  #photo-sheet .thumb { width:46px; height:46px; border-radius:50%; overflow:hidden; background:#f3ecff;
    display:flex; align-items:center; justify-content:center; font-size:24px; flex:0 0 auto; }
  #photo-sheet .nm { flex:1; font-weight:800; color:#3a1d6e; font-size:.95rem; }
  #photo-sheet button.act { border:0; border-radius:10px; padding:9px 12px; font-weight:800; font-size:.8rem;
    background:#f3ecff; color:#5a3fb0; cursor:pointer; }
  #photo-sheet button.del { background:#ffeaee; color:#c02646; }
  #photo-sheet button.done { width:100%; margin-top:14px; border:0; border-radius:12px; padding:13px;
    background:linear-gradient(90deg,#7c3aed,#ec4899); color:#fff; font-weight:800; font-size:1rem; cursor:pointer; }
  .card.wiggle { animation:wiggle .4s; }
  .card.win { animation:win .6s cubic-bezier(.34,1.56,.64,1); }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-7deg)} 75%{transform:rotate(7deg)} }
  @keyframes win { 0%{transform:scale(1)} 40%{transform:scale(1.25)} 100%{transform:scale(1)} }
  .btn { position:absolute; z-index:100; background:rgba(255,255,255,.22); border:2px solid rgba(255,255,255,.4); color:#fff;
         border-radius:50px; padding:8px 16px; font-family:inherit; font-size:1rem; cursor:pointer; backdrop-filter:blur(6px); }
  #fs-btn { bottom:calc(env(safe-area-inset-bottom,0px) + 20px); right:20px; }
  #sound-btn { top:16px; right:16px; padding:8px 12px; font-size:1.4rem; }
  #back-btn { top:16px; left:16px; text-decoration:none; }
  .confetti { position:absolute; font-size:2.2rem; pointer-events:none; z-index:50; animation:fall 1.2s ease-out forwards; }
  @keyframes fall { 0%{opacity:1; transform:translateY(0) rotate(0) scale(.6)} 100%{opacity:0; transform:translateY(60vh) rotate(300deg) scale(1)} }
</style>
</head>
<body>
<div id="game">
  <button id="photo-btn" onclick="openPhotoSheet()" title="Use your own family photos">📷 Photos</button>
  <a id="back-btn" class="btn" href="../index.html">←</a>
  <div id="sound-btn" class="btn" onclick="toggleSound()">🔊</div>
  <div id="voice-btn" class="btn" onclick="BabyVoice.openPicker()" style="bottom:20px;left:50%;transform:translateX(-50%);padding:7px 14px;font-size:.9rem">🗣️ Voice</div>
  <div id="prompt">Tap to start! 👆<small>Find who I say</small></div>
  <div id="choices"></div>
  <button id="fs-btn" class="btn" onclick="goFullscreen()">⛶ Full Screen</button>
</div>

<div id="photo-sheet"><div class="inner">
  <h3>Your own family photos</h3>
  <p>Add a real photo for each person and the game uses it instead of the stock picture — much more fun for a
     toddler learning faces. Photos are stored on this phone only and never uploaded.</p>
  <div id="photo-rows"></div>
  <button class="done" onclick="closePhotoSheet()">Done</button>
</div></div>

<script src="voice.js"></script>
<script src="photos.js"></script>
<script src="kit.js"></script>
<script>
// Family members a toddler can learn to recognise by name.
var PEOPLE = [
  { who:"Mommy",   face:"👩", say:"Mommy" },
  { who:"Daddy",   face:"👨", say:"Daddy" },
  { who:"Baby",    face:"👶", say:"the Baby" },
  { who:"Grandma", face:"👵", say:"Grandma" },
  { who:"Grandpa", face:"👴", say:"Grandpa" },
  { who:"Doggy",   face:"🐶", say:"the Doggy" },
  { who:"Kitty",   face:"🐱", say:"the Kitty" },
  { who:"Brother", face:"👦", say:"Brother" },
  { who:"Sister",  face:"👧", say:"Sister" },
];
var CHEERS = ["Yay!","Good job!","You did it!","Hooray!","Well done!","Yes!"];

var soundOn = true, target = null, started = false, actx = null;
function ctx(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function chime(){
  if(!soundOn) return;
  try{ var c=ctx(); [523,659,784,1047].forEach(function(f,i){ var o=c.createOscillator(),g=c.createGain(); o.connect(g); g.connect(c.destination);
    o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,c.currentTime+i*.09);
    g.gain.exponentialRampToValueAtTime(.3,c.currentTime+i*.09+.02); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+i*.09+.35);
    o.start(c.currentTime+i*.09); o.stop(c.currentTime+i*.09+.4); }); }catch(e){}
}
function boing(){ if(!soundOn) return; try{ var c=ctx(),o=c.createOscillator(),g=c.createGain(); o.connect(g); g.connect(c.destination);
  o.type='sine'; o.frequency.setValueAtTime(300,c.currentTime); o.frequency.exponentialRampToValueAtTime(160,c.currentTime+.25);
  g.gain.setValueAtTime(.3,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.3); o.start(); o.stop(c.currentTime+.3);}catch(e){} }

function say(text,cb){ if(!soundOn){ if(cb) setTimeout(cb,500); return; } BabyVoice.say(text,cb); }

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* One question at a time: the voice callback and the safety timer used to both
   fire, which flicked through two or three questions in a blink. */
var advLock = false;
function scheduleNext(text, minMs){
  if (advLock) return;
  advLock = true;
  var fired = false;
  function go(){ if (fired) return; fired = true; advLock = false; round(); }
  if (text){
    say(text, function(){ setTimeout(go, minMs || 500); });
    setTimeout(go, 4500);                 // safety net if the voice never reports back
  } else {
    setTimeout(go, minMs || 1200);        // nothing to say — just pause and move on
  }
}

function openPhotoSheet(){
  var rows = document.getElementById('photo-rows');
  rows.innerHTML = '';
  PEOPLE.forEach(function(p){
    var row = document.createElement('div'); row.className = 'prow';
    var thumb = document.createElement('div'); thumb.className = 'thumb';
    BabyPhotos.fill(thumb, p.who, p.face, {round:true, alt:p.who});
    var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = p.who;
    var pick = document.createElement('button'); pick.className = 'act';
    pick.textContent = BabyPhotos.own.get(p.who) ? 'Change' : 'Choose photo';
    pick.addEventListener('click', function(){
      BabyPhotos.upload(p.who, function(ok){ if (ok){ openPhotoSheet(); round(); } });
    });
    row.appendChild(thumb); row.appendChild(nm); row.appendChild(pick);
    if (BabyPhotos.own.get(p.who)){
      var del = document.createElement('button'); del.className = 'act del'; del.textContent = 'Remove';
      del.addEventListener('click', function(){ BabyPhotos.own.clear(p.who); openPhotoSheet(); round(); });
      row.appendChild(del);
    }
    rows.appendChild(row);
  });
  document.getElementById('photo-sheet').classList.add('on');
}
function closePhotoSheet(){ document.getElementById('photo-sheet').classList.remove('on'); }
document.getElementById('photo-sheet').addEventListener('click', function(e){
  if (e.target === this) closePhotoSheet();
});

BabyPhotos.warm(PEOPLE.map(function(p){ return p.who; }));

function round(){
  advLock = false;
  var pool = shuffle(PEOPLE);
  var count = Math.min(3, PEOPLE.length);
  var choices = pool.slice(0, count);
  target = choices[Math.floor(Math.random()*choices.length)];
  var box = document.getElementById('choices');
  box.innerHTML = '';
  shuffle(choices).forEach(function(p){
    var c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = '<div class="face"></div><div class="who">'+p.who+'</div>';
    BabyPhotos.fill(c.querySelector('.face'), p.who, p.face, {round:true, alt:p.who});
    c.addEventListener('click', function(){ pick(p, c); });
    box.appendChild(c);
  });
  document.getElementById('prompt').innerHTML = "Where's <b>"+target.who+"</b>? 👀";
  setTimeout(function(){ say("Where's " + target.say + "?"); }, 250);
}

function pick(p, card){
  if(p.who === target.who){
    card.classList.add('win'); chime(); confetti();
    var cheer = CHEERS[Math.floor(Math.random()*CHEERS.length)];
    document.getElementById('prompt').innerHTML = cheer + " 🎉";
    scheduleNext(cheer + " That's " + target.say + "!", 900);
  } else {
    card.classList.add('wiggle'); boing();
    setTimeout(function(){ card.classList.remove('wiggle'); }, 400);
    say("Try again! Where's " + target.say + "?");
  }
}

function confetti(){
  var g=document.getElementById('game'), ce="🎉🎈⭐🌟💫🎊✨".split('');
  for(var i=0;i<18;i++){ var el=document.createElement('div'); el.className='confetti';
    el.textContent=ce[Math.floor(Math.random()*ce.length)];
    el.style.left=(Math.random()*100)+'vw'; el.style.top=(-10-Math.random()*20)+'vh';
    el.style.animationDelay=(Math.random()*.3)+'s'; g.appendChild(el);
    el.addEventListener('animationend', function(){ this.remove(); }); }
}

function toggleSound(){ soundOn=!soundOn; document.getElementById('sound-btn').textContent = soundOn?'🔊':'🔇'; if(!soundOn){ try{speechSynthesis.cancel();}catch(e){} } }
function goFullscreen(){ var el=document.documentElement, r=el.requestFullscreen||el.webkitRequestFullscreen; if(r) r.call(el);
  setTimeout(function(){ var b=document.getElementById('fs-btn'); b.style.opacity='0'; b.style.pointerEvents='none'; },1000); }
document.addEventListener('fullscreenchange', function(){ if(!document.fullscreenElement){ var b=document.getElementById('fs-btn'); b.style.opacity='1'; b.style.pointerEvents='auto'; } });

document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){ e.preventDefault(); }, { passive:false });
document.getElementById('game').addEventListener('click', function start(){
  if(started) return; started=true; try{ctx().resume();}catch(e){}
  document.getElementById('prompt').textContent='';
  round();
}, { once:false });
</script>
</body>
</html>
