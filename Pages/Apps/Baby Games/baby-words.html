<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>First Words</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:'Fredoka One','Comic Sans MS',cursive; touch-action:none; }
  #game { width:100vw; height:100vh; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
          background:radial-gradient(ellipse at 25% 25%,#ffe08a 0%,transparent 55%),radial-gradient(ellipse at 80% 75%,#8ce0ff 0%,transparent 55%),linear-gradient(160deg,#ff8fb1,#7c5cff); transition:background .4s; }
  #card { width:min(70vw,70vh); aspect-ratio:1; border-radius:40px; background:rgba(255,255,255,.94); display:flex; align-items:center; justify-content:center;
          box-shadow:0 20px 50px rgba(0,0,0,.28); cursor:pointer; transition:transform .14s cubic-bezier(.34,1.56,.64,1); }
  #card:active { transform:scale(.95); }
  #card.pop { animation:pop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 0%{transform:scale(.6);opacity:0} 60%{transform:scale(1.12)} 100%{transform:scale(1);opacity:1} }
  #pic { font-size:min(42vw,42vh); line-height:1; }
  #word { margin-top:4vh; font-size:clamp(2rem,10vw,4.5rem); color:#fff; text-shadow:0 4px 16px rgba(0,0,0,.35); text-transform:capitalize; letter-spacing:2px; min-height:1.2em; }
  #hint { position:absolute; bottom:16vh; font-size:clamp(1rem,4vw,1.4rem); color:rgba(255,255,255,.85); }
  .btn { position:absolute; z-index:100; background:rgba(255,255,255,.22); border:2px solid rgba(255,255,255,.4); color:#fff;
         border-radius:50px; padding:8px 16px; font-family:inherit; font-size:1rem; cursor:pointer; backdrop-filter:blur(6px); text-decoration:none; }
  #fs-btn{bottom:20px;right:20px} #sound-btn{top:16px;right:16px;padding:8px 12px;font-size:1.4rem} #back-btn{top:16px;left:16px}
  #next-btn{bottom:20px;left:20px}
  .confetti { position:absolute; font-size:2rem; pointer-events:none; z-index:60; animation:fall 1.1s ease-out forwards; }
  @keyframes fall { 0%{opacity:1;transform:translateY(0) rotate(0)} 100%{opacity:0;transform:translateY(55vh) rotate(280deg)} }
</style>
</head>
<body>
<div id="game">
  <a id="back-btn" class="btn" href="../index.html">←</a>
  <div id="sound-btn" class="btn" onclick="toggleSound()">🔊</div>
  <div id="voice-btn" class="btn" onclick="BabyVoice.openPicker()" style="bottom:20px;left:50%;transform:translateX(-50%);padding:7px 14px;font-size:.9rem">🗣️ Voice</div>
  <div id="card"><div id="pic">👋</div></div>
  <div id="word">tap me!</div>
  <div id="hint">Tap the picture to hear the word</div>
  <button id="next-btn" class="btn" onclick="next()">Next ➡️</button>
  <button id="fs-btn" class="btn" onclick="goFullscreen()">⛶ Full Screen</button>
</div>
<script src="voice.js"></script>
<script>
var WORDS = [
  {p:"🍎",w:"apple"},{p:"🍌",w:"banana"},{p:"🐶",w:"dog"},{p:"🐱",w:"cat"},{p:"🚗",w:"car"},
  {p:"⚽",w:"ball"},{p:"⭐",w:"star"},{p:"🌙",w:"moon"},{p:"☀️",w:"sun"},{p:"🌸",w:"flower"},
  {p:"🐟",w:"fish"},{p:"🦆",w:"duck"},{p:"🐻",w:"bear"},{p:"🍪",w:"cookie"},{p:"🥛",w:"milk"},
  {p:"👟",w:"shoe"},{p:"🎈",w:"balloon"},{p:"🚌",w:"bus"},{p:"🌳",w:"tree"},{p:"🐝",w:"bee"},
  {p:"🍇",w:"grapes"},{p:"🧸",w:"teddy"},{p:"🚂",w:"train"},{p:"🐘",w:"elephant"},{p:"🦋",w:"butterfly"},
  {p:"🍦",w:"ice cream"},{p:"🐸",w:"frog"},{p:"🎂",w:"cake"},{p:"👶",w:"baby"},{p:"🐰",w:"bunny"}
];
var order = [], idx = -1, soundOn = true, actx = null;
function ctx(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function chime(){ if(!soundOn) return; try{ var c=ctx(); [660,880].forEach(function(f,i){ var o=c.createOscillator(),g=c.createGain(); o.connect(g); g.connect(c.destination);
  o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,c.currentTime+i*.1); g.gain.exponentialRampToValueAtTime(.3,c.currentTime+i*.1+.02);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+i*.1+.3); o.start(c.currentTime+i*.1); o.stop(c.currentTime+i*.1+.35); }); }catch(e){} }
function say(t){ if(!soundOn) return; BabyVoice.say(t); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function show(){
  var item = order[idx];
  document.getElementById('pic').textContent = item.p;
  document.getElementById('word').textContent = item.w;
  var card = document.getElementById('card'); card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
  say(item.w);
}
function next(){ idx++; if(idx>=order.length){ order=shuffle(WORDS); idx=0; } document.getElementById('hint').style.opacity='.4'; show(); }
document.getElementById('card').addEventListener('click', function(){
  if(idx<0){ next(); return; }
  chime(); confetti(); say(order[idx].w + "!");
});
function confetti(){ var g=document.getElementById('game'), ce="🎉🎈⭐🌟✨".split('');
  for(var i=0;i<12;i++){ var el=document.createElement('div'); el.className='confetti'; el.textContent=ce[Math.floor(Math.random()*ce.length)];
    el.style.left=(Math.random()*100)+'vw'; el.style.top=(-10)+'vh'; el.style.animationDelay=(Math.random()*.3)+'s'; g.appendChild(el);
    el.addEventListener('animationend', function(){ this.remove(); }); } }
function toggleSound(){ soundOn=!soundOn; document.getElementById('sound-btn').textContent=soundOn?'🔊':'🔇'; if(!soundOn){try{speechSynthesis.cancel();}catch(e){}} }
function goFullscreen(){ var el=document.documentElement,r=el.requestFullscreen||el.webkitRequestFullscreen; if(r)r.call(el);
  setTimeout(function(){ var b=document.getElementById('fs-btn'); b.style.opacity='0'; b.style.pointerEvents='none'; },1000); }
document.addEventListener('fullscreenchange', function(){ if(!document.fullscreenElement){ var b=document.getElementById('fs-btn'); b.style.opacity='1'; b.style.pointerEvents='auto'; } });
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){ e.preventDefault(); }, { passive:false });
order = shuffle(WORDS);
document.addEventListener('touchstart', function(){ try{ctx().resume();}catch(e){} }, { once:true });
</script>
</body>
</html>
