<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TWC Strong — Video Tutorial | TWC Ministries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#ff6b35;--accent2:#a78bfa;--dark:#131228;--dark2:#1a1836}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:radial-gradient(ellipse 90% 60% at 50% -10%,rgba(107,61,181,.18),transparent 60%),linear-gradient(160deg,#131228,#0a0916);color:#fff;min-height:100vh;line-height:1.6;display:flex;flex-direction:column;align-items:center;padding:28px 18px 60px}
a{color:inherit;text-decoration:none}
.top{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.back{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6);padding:9px 16px;border:1px solid rgba(255,255,255,.14);border-radius:9px;transition:.2s}
.back:hover{color:#fff;border-color:var(--accent2)}
.eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--accent2);text-align:center;margin-bottom:10px}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.1rem,7vw,3rem);font-weight:700;text-align:center;line-height:1.05;
   background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:rgba(255,255,255,.6);font-size:1rem;margin-top:8px;margin-bottom:26px}
.phone{width:100%;max-width:340px;border-radius:34px;padding:12px;background:#101019;border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03)}
video{width:100%;display:block;border-radius:24px;background:#000}
.cta-row{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap;justify-content:center;width:100%;max-width:400px}
.btn{flex:1;min-width:150px;text-align:center;padding:14px 20px;border-radius:11px;font-weight:700;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;transition:.2s}
.btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-ghost{border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.8)}
.btn-ghost:hover{border-color:var(--accent2);color:#fff}
.note{margin-top:26px;font-size:.74rem;color:rgba(255,255,255,.35);text-align:center;max-width:420px}
</style>
</head>
<body>
  <div class="top">
    <a class="back" href="../index.html">← All Apps</a>
    <a class="back" href="./worker/">Open App →</a>
  </div>
  <p class="eyebrow">Video Tutorial</p>
  <h1>TWC Strong</h1>
  <p class="sub">Track every workout</p>
  <div class="phone">
    <video controls playsinline preload="metadata">
      <source src="../tutorials/twc-strong-walkthrough.mp4" type="video/mp4">
      Your browser does not support video playback.
    </video>
  </div>
  <div class="cta-row">
    <a class="btn btn-primary" href="./worker/">Open the App</a>
    <a class="btn btn-ghost" href="../index.html">Back to Apps</a>
  </div>
  <p class="note">A short guided walkthrough of TWC Strong. The on-screen phone is a faithful recreation of the app, narrated for tutorial purposes.</p>
</body>
</html>
